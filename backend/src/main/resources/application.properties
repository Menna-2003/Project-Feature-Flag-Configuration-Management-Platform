spring.application.name=backend

# 1. Database Location (URL)
# syntax: jdbc:mysql://[host]:[port]/[database_name]
spring.datasource.url=jdbc:mysql://localhost:3306/feature_flag_db

# 2. Your MySQL Username (usually 'root')
spring.datasource.username=root

# 3. Your MySQL Password
spring.datasource.password=Menna123$456

# 4. Hibernate Config (Optional but recommended for Dev)
# "update" will automatically create tables for your entities if they don't exist
spring.jpa.hibernate.ddl-auto=update

# 5. Show SQL (Optional - helps you see what's happening in logs)
spring.jpa.show-sql=true